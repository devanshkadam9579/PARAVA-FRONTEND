  <rect x="180" y="90" width="30" height="10" rx="5" fill="#1A202C" transform="rotate(-15 200 140)"/>

  <!-- Hands / Arms -->
  <path d="M 145 75 Q 100 100 150 145" fill="none" stroke="#1A202C" stroke-width="4" stroke-linecap="round"/>
  <path d="M 140 105 Q 110 130 160 165" fill="none" stroke="#1A202C" stroke-width="4" stroke-linecap="round"/>
  
  <path d="M 255 105 Q 310 140 250 185" fill="none" stroke="#1A202C" stroke-width="4" stroke-linecap="round"/>
  <path d="M 235 125 Q 285 160 230 195" fill="none" stroke="#1A202C" stroke-width="4" stroke-linecap="round"/>

  <!-- Head & Purple Cap -->
  <!-- Head -->
  <path d="M 215 30 Q 275 30 270 70 Q 230 85 210 70 Z" fill="#FFFDF8" stroke="#1A202C" stroke-width="4"/>
  <!-- Cap -->
  <path d="M 195 20 C 200 0, 275 0, 275 30 L 195 30 Z" fill="#7E22CE" stroke="#1A202C" stroke-width="4"/>
  <path d="M 180 30 L 255 30 C 255 30, 240 38, 180 35 Z" fill="#7E22CE" stroke="#1A202C" stroke-width="4"/>

